<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Binh Nguyen | Professional & Creative Hub</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .top-bar { padding: 25px 40px; text-align: right; color: #94a3b8; font-weight: 600; }
        .top-bar span { color: #38bdf8; cursor: pointer; }
        
        header { padding: 40px 20px; text-align: center; }
        header h1 { font-family: 'Playfair Display', serif; font-size: 48px; margin: 0 0 10px 0; color: #f8fafc; }
        header p { color: #94a3b8; font-size: 18px; }

        /* Grid Layout cho các Hub */
        .hub-grid {
            max-width: 1000px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .hub-item {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #334155;
            transition: all 0.3s;
            text-decoration: none;
            color: #f8fafc;
        }
        .hub-item:hover { border-color: #38bdf8; transform: translateY(-5px); background-color: #2d3748; }
        .hub-item i { font-size: 40px; color: #38bdf8; margin-bottom: 15px; }
        .hub-item h3 { font-size: 16px; margin: 0; }

        footer { text-align: center; padding: 30px; color: #64748b; font-size: 13px; margin-top: auto; }
    </style>
</head>
<body>

    <div class="top-bar">VN | EN | JP | CN</div>

    <header>
        <h1>Thanh Binh Nguyen</h1>
        <p>Chuyên gia Địa chất | Đổi mới Công nghệ | Nghệ thuật & Cộng đồng</p>
    </header>

    <div class="hub-grid">
        <a href="geoscience.html" class="hub-item">
            <i class="fa-solid fa-flask"></i><h3>Geoscience</h3>
        </a>
        <a href="innovation.html" class="hub-item">
            <i class="fa-solid fa-lightbulb"></i><h3>Innovation</h3>
        </a>
        <a href="music.html" class="hub-item">
            <i class="fa-solid fa-music"></i><h3>Music</h3>
        </a>
        <a href="hospitality.html" class="hub-item">
            <i class="fa-solid fa-hotel"></i><h3>Hospitality</h3>
        </a>
        <a href="video.html" class="hub-item">
            <i class="fa-solid fa-video"></i><h3>Video Creation</h3>
        </a>
    </div>

    <footer>&copy; 2026 Thanh Binh Nguyen Hub.</footer>

</body>
</html>
