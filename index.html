<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Thị Thanh Bình - Personal Knowledge Hub</title>
    
    <style>
body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000; /* Nền đen để lót nếu màn hình có tỷ lệ khác ảnh */
        }
        
        .banner-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Chỉnh chỗ này để hiển thị trọn vẹn ảnh */
        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Quan trọng: Giữ nguyên tỷ lệ ảnh, không cắt xén */
        }

        /* 4 Nút Action đặt ngay dưới khu vực icon trên ảnh */
        .action-box {
            position: absolute;
            top: 58%; /* Chị chỉnh số này (ví dụ 56% hoặc 60%) để nút khớp chuẩn ngay dưới icon */
            left: 5%;
            width: 45%;
            z-index: 5;
        }

        .action-links { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }

        .btn-hub {
            padding: 18px 10px;
            background: #0056b3;
            color: white !important;
            text-decoration: none;
            border-radius: 6px;
            font-size: 3.2em;
            text-align: center;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
             
        .btn-hub:hover { background: #004494; }
    </style>
</head>
<body>

    <div class="banner-container">
        <!-- Banner -->
        <img src="Banner-ThanhBinh-Hub-3.png" alt="Thanh Binh Homepage Banner">
        
        <!-- 4 Nút Action đã được đẩy xuống vị trí thấp hơn -->
        <div class="action-box">
            <div class="action-links">
                <a href="geoscience.html" class="btn-hub">🔬 Geoscience</a>
                <a href="innovation.html" class="btn-hub">💡 Innovation</a>
                <a href="music.html" class="btn-hub">🎵 Music & MV</a>
                <a href="video.html" class="btn-hub">🎬 Video Creation</a>
            </div>
        </div>
    </div>

</body>
</html>
