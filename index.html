<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Thị Thanh Bình - Personal Knowledge Hub</title>
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000; /* Màu nền đen để tôn banner */
        }
        
        /* Container chính chứa banner */
        .banner-container {
            position: relative;
            width: 100%;
            height: 100vh; /* Chiều cao bằng đúng màn hình */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Đảm bảo ảnh hiển thị toàn bộ (không bị cắt) */
        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Quan trọng: Hiển thị trọn vẹn ảnh */
        }

        /* Thanh ngôn ngữ */
        .lang-switch {
            position: absolute;
            top: 25px; left: 35px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 25px;
            border-radius: 30px;
            z-index: 10;
            display: flex; gap: 15px;
        }
        .lang-switch a { color: #fff; text-decoration: none; font-size: 2.2em; font-weight: 600; }

        /* Hộp thông tin và Nút bấm */
        .overlay-box {
            position: absolute;
            bottom: 40px; right: 40px;
            width: 50%;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .overlay-box h3 { color: #0056b3; margin: 0 0 10px 0; font-size: 4.0em; }
        .overlay-box p { margin: 0 0 15px 0; font-size: 2.5em; color: #333; }

        .action-links { display: flex; gap: 15px; margin-top: 20px; }
        .btn-hub {
            flex: 1;
            padding: 15px;
            background: #0056b3;
            color: white !important;
            text-decoration: none;
            border-radius: 8px;
            font-size: 2.2em;
            text-align: center;
            font-weight: bold;
        }
        .btn-hub:hover { background: #004494; }
    </style>
</head>
<body>

    <div class="banner-container">
        <!-- Ngôn ngữ -->
        <div class="lang-switch">
            <a href="index.html">VN</a> | <a href="en.html">EN</a> | 
            <a href="jp.html">JP</a> | <a href="zh.html">ZH</a>
        </div>

        <!-- Banner trọn vẹn -->
        <img src="Banner-ThanhBinh-Hub-3.png" alt="Thanh Binh Homepage Banner">
        
        <!-- Nội dung và Nút bấm -->
        <div class="overlay-box">
            <h3>Chân dung chuyên môn & Hoạt động</h3>
            <p><strong>Tiến sĩ Địa chất | Chuyên gia đổi mới công nghệ</strong></p>
            <p>Chào mừng bạn đến với không gian số cá nhân. Nơi chia sẻ hành trình chuyên môn, dự án âm nhạc giao lưu văn hóa và hoạt động cộng đồng.</p>
            
            <div class="action-links">
                <a href="geoscience.html" class="btn-hub">🔬 Geoscience</a>
                <a href="innovation.html" class="btn-hub">🔬 Innovation</a>
                <a href="music.html" class="btn-hub">🎵 Music & MV</a>
                <a href="video.html" class="btn-hub">🎵 Video </a>
            </div>
        </div>
    </div>

</body>
</html>
