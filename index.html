<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Thị Thanh Bình - Personal Knowledge Hub</title>
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff; /* Nền trắng để liền mạch, mất hẳn viền đen */
        }
        
        .banner-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Giữ trọn vẹn 100% ảnh banner không bị cắt xén */
        .banner-container img {
            max-width: 100%;
            max-height: 75vh; /* Giới hạn chiều cao ảnh để chừa không gian phía dưới cho nút */
            object-fit: contain;
        }

        /* Đưa 4 nút bấm xuống hẳn vùng bên dưới ảnh, không lo bị che lấp */
        .action-box {
            position: absolute;
            bottom: 30px; /* Cố định cách đáy màn hình 30px */
            left: 5%;
            width: 90%;
            z-index: 5;
        }

        .action-links { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); /* Xếp thành 1 hàng ngang gồm 4 nút cho đẹp */
            gap: 15px; 
        }

        .btn-hub {
            padding: 16px 10px;
            background: #0056b3;
            color: white !important;
            text-decoration: none;
            border-radius: 6px;
            font-size: 2.8em;
            text-align: center;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
             
        .btn-hub:hover { background: #004494; }
    </style>
</head>
<body>

    <div class="banner-container">
        <!-- Banner hiển thị trọn vẹn 100% -->
        <img src="Banner-ThanhBinh-Hub-3.png" alt="Thanh Binh Homepage Banner">
        
        <!-- 4 Nút Action nằm gọn gàng ở phía dưới banner, xếp thành 1 hàng ngang -->
        <div class="action-box">
            <div class="action-links">
                <a href="geoscience.html" class="btn-hub">🔬 Geoscience</a>
                <a href="innovation.html" class="btn-hub">💡 Innovation</a>
                <a href="music.html" class="btn-hub">🎵 Music & MV</a>
                <a href="video.html" class="btn-hub">🎬 Video Creation</a>
            </div>
        </div>
    </div>

</body>
</html>
