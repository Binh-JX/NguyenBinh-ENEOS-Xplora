<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Binh Nguyen - Professional & Creative Hub</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
        }

        /* --- BANNER CHÍNH THỨC SẠCH SẼ, KHÔNG LỖI --- */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 550px;
            background: url('Banner-ThanhBinh-Hub-3.png') no-repeat center center;
            background-size: 100% 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 40px;
        }

        /* Thanh ngôn ngữ góc phải trên cùng */
        .hero-top {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 2;
        }
        .lang-switch {
            background: rgba(11, 15, 25, 0.7);
            padding: 6px 14px;
            border-radius: 6px;
            color: #ffffff;
            font-size: 40px;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.25);
            backdrop-filter: blur(4px);
        }
        .lang-switch span {
            color: #38bdf8;
            cursor: pointer;
        }

        /* Phần dưới chứa Icon và Khung chuyên môn */
        .hero-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 10px;
            z-index: 2;
        }

        /* Hàng Icon điều hướng */
        .icon-nav-bar {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .icon-item {
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.3s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icon-item:hover {
            transform: translateY(-4px);
            color: #38bdf8;
        }

        .icon-circle {
            width: 100px;
            height: 100px;
            background: rgba(11, 15, 25, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 5px;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: border-color 0.3s, background 0.3s;
        }

        .icon-item:hover .icon-circle {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.25);
        }

        .icon-item span {
            font-size: 50px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
        }

        /* Khung Chân dung chuyên môn bên phải */
        .profile-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 16px 20px;
            border-radius: 12px;
            max-width: 300px;
            color: #1e293b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-left: 4px solid #38bdf8;
            backdrop-filter: blur(8px);
            margin-right: 10px;
        }

        .profile-card h3 {
            font-size: 2.2rem;
            margin: 0 0 6px 0;
            color: #0f172a;
        }

        .profile-card p {
            font-size: 2.2rem;
            line-height: 1.4;
            color: #475569;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- BANNER CHÍNH THỨC -->
    <div class="hero-banner">
        
        <!-- Thanh ngôn ngữ góc phải -->
        <div class="hero-top">
            <div class="lang-switch">VN | <span>EN</span> | JP | CN</div>
        </div>

        <!-- Các Icon điều hướng và Khung chuyên môn -->
        <div class="hero-content">
            
            <!-- CÁC ICON ĐIỀU HƯỚNG  -->
            <div class="icon-nav-bar">
                <a href="geoscience.html" class="icon-item">
                    <div class="icon-circle"><i class="fa-solid fa-flask"></i></div>
                    <span>GEOSCIENCE</span>
                </a>
                <a href="innovation.html" class="icon-item">
                    <div class="icon-circle"><i class="fa-solid fa-lightbulb"></i></div>
                    <span>INNOVATION</span>
                </a>
                <a href="music.html" class="icon-item">
                    <div class="icon-circle"><i class="fa-solid fa-music"></i></div>
                    <span>MUSIC</span>
                </a>
                <a href="video.html" class="icon-item">
                    <div class="icon-circle"><i class="fa-solid fa-video"></i></div>
                    <span>VIDEO CREATION</span>
                </a>
            </div>

            <!-- Khung Chân dung chuyên môn bên phải -->
            <div class="profile-card">
                <h3>Chân dung chuyên môn & Hoạt động</h3>
                <p><strong>Tiến sĩ Địa chất | Chuyên gia đổi mới công nghệ</strong> tại e-TEC, ENEOS Xplora <br>Chào mừng bạn đến với không gian số cá nhân. Nơi chia sẻ hành trình chuyên môn, các dự án âm nhạc giao lưu văn hóa Việt - Nhật.</p>
            </div>
        </div>

    </div>

</body>
</html>
