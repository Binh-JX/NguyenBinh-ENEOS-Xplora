<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Thị Thanh Bình - Personal Knowledge Hub</title>
    
    <style>
body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff;
        }

        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

              /* Thanh ngôn ngữ */
        .lang-switch {
            position: absolute;
            top: 25px; right: 50px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 25px;
            border-radius: 30px;
            z-index: 10;
            display: flex; gap: 15px;
        }
        .lang-switch a { color: #fff; text-decoration: none; font-size: 5.0em; font-weight: 600; }

        /* Hộp 4 nút bấm ở BÊN TRÁI */
        .action-box {
            position: absolute;
            bottom: 30px; 
            left: 30px;
            width: 38%;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* 4 nút bấm xếp thành lưới 2x2 */
        .action-links { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
        }
.btn-hub {
            padding: 22px 10px; /* Tăng padding trên/dưới lên 22px để nút cao hơn */
            background: #0056b3;
            color: white !important;
            text-decoration: none;
            border-radius: 6px;
            font-size: 3.5em;
            text-align: center;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
             
        .btn-hub:hover { background: #004494; }

        /* Hộp giới thiệu ở BÊN PHẢI */
        .overlay-box {
            position: absolute;
            bottom: 30px; 
            right: 30px;
            width: 52%;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .overlay-box h3 { 
            color: #0056b3; 
            margin: 0 0 12px 0; 
            font-size: 5.0em; 
            line-height: 1.2;
        }
        
        .overlay-box p { 
            margin: 0 0 15px 0; 
            font-size: 4.0em; 
            color: #333; 
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <!-- Ngôn ngữ -->
        <div class="lang-switch">
            <a href="index.html">VN</a> | <a href="en.html">EN</a> | 
            <a href="jp.html">JP</a> | <a href="zh.html">ZH</a>
        </div>

        <!-- Banner trọn vẹn -->
        <img src="Banner-ThanhBinh-Hub-3.png" alt="Thanh Binh Homepage Banner">
        
        <!-- 4 Nút Action ở BÊN TRÁI -->
        <div class="action-box">
            <div class="action-links">
                <a href="geoscience.html" class="btn-hub">🔬 Geoscience</a>
                <a href="innovation.html" class="btn-hub">💡 Innovation</a>
                <a href="music.html" class="btn-hub">🎵 Music & MV</a>
                <a href="video.html" class="btn-hub">🎬 Video Creation</a>
            </div>
        </div>

        <!-- Hộp giới thiệu ở BÊN PHẢI -->
        <div class="overlay-box">
            <h3>Chân dung chuyên môn & Hoạt động</h3>
            <p><strong>Tiến sĩ Địa chất | Chuyên gia đổi mới công nghệ</strong></p>
            <p>Chào mừng đến với không gian số cá nhân. Nơi chia sẻ hành trình chuyên môn, dự án âm nhạc giao lưu văn hóa và hoạt động cộng đồng.</p>
        </div>
    </div>

</body>
</html>
