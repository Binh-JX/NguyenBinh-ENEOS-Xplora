    <!-- CSS GIỮ NGUYÊN CHUẨN CỦA CHỊ + BỔ SUNG NÚT CHUYỂN NGÔN NGỮ -->
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.6; 
            color: #333; 
            background-color: #f4f6f8;
        }
        
        /* Khung bao ngoài banner và text đè lên */
        .banner-wrapper {
            position: relative;
            width: 100%;
            margin: 0;
            padding: 0;
            line-height: 0;
        }

        .banner-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Nút chuyển đổi ngôn ngữ ở góc trên bên trái */
        .lang-switch {
            position: absolute;
            top: 25px;
            left: 35px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 22px;
            border-radius: 25px;
            z-index: 10;
        }

        .lang-switch a {
            color: #fff;
            text-decoration: none;
            font-size: 2.2em;
            font-weight: 600;
        }

        .lang-switch a:hover {
            color: #ffdf6d;
        }

        /* Hộp text được phóng to và làm nổi bật ở góc phải */
        .overlay-box {
            position: absolute;
            bottom: 35px;
            right: 45px;
            width: 60%; 
            max-width: 750px;
            background: rgba(255, 255, 255, 0.92); 
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.35);
            text-align: left;
            line-height: 1.6;
        }

        .overlay-box h3 {
            color: #0056b3;
            margin: 0 0 12px 0;
            font-size: 5.0em; 
        }

        .overlay-box p {
            margin: 0 0 15px 0;
            font-size: 3.5em; 
            color: #222;
        }

        .overlay-box p:last-child {
            margin-bottom: 0;
        }

        /* Phần chân trang ngày cập nhật */
        .footer-update {
            max-width: 1500px;
            margin: 20px auto;
            padding: 0 25px;
            text-align: left;
            color: #666;
            font-size: 4.5em;
            font-style: italic;
        }
    </style>
</head>
