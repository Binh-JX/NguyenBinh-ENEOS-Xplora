<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music & MV - Nguyễn Thị Thanh Bình</title>
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #fff;
        }

        /* Nút về trang chủ góc trái */
        .back-home {
            position: absolute;
            top: 20px;
            left: 30px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            transition: 0.3s;
            z-index: 10;
        }
        .back-home:hover { background: rgba(255, 255, 255, 0.3); }

        .music-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .music-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .music-header h1 {
            font-size: 2.5em;
            margin: 0 0 10px 0;
            color: #4da6ff;
        }

        .music-header p {
            font-size: 1.2em;
            color: #aaa;
            margin: 0;
        }

        /* Khung chứa nội dung YouTube nổi bật và rộng rãi hơn */
        .youtube-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .youtube-card h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .youtube-card p {
            color: #ccc;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .btn-youtube {
            display: inline-block;
            padding: 12px 30px;
            background: #ff0000;
            color: white !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 4px 15px rgba(255,0,0,0.4);
            transition: 0.3s;
        }

        .btn-youtube:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">← Trang chủ</a>

    <div class="music-container">
        <div class="music-header">
            <h1>🎵 Music & MV Hub</h1>
            <p>Không gian âm nhạc, các dự án ca khúc và giao lưu văn hóa</p>
        </div>

        <div class="youtube-card">
            <h3>Thanh Binh Nguyen Channel</h3>
            <p>Thưởng thức các bản cover âm nhạc, các sản phẩm video kết hợp nghệ thuật và cảm xúc.</p>
            <a href="https://www.youtube.com/@thanhbinhnguyen..." target="_blank" class="btn-youtube">Khám phá Kênh YouTube</a>
        </div>
    </div>

</body>
</html>
